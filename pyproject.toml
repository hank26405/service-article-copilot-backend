[project]
name = "service-article-copilot"
version = "0.3.1"
description = "Article Copilot - AI-powered article management service with Redis cache and MongoDB storage."
authors = [
    { name = "Hank Liang", email = "HankLiang@example.com" }
]
requires-python = ">=3.11.8,<3.12"
dependencies = [
    # Web Framework
    "gunicorn>=23.0.0",
    "uvicorn[standard]>=0.30.0",
    "fastapi>=0.115.0",
    "python-multipart>=0.0.9",
    
    # HTTP Clients
    "urllib3>=2.0.0",
    "requests>=2.32.0",
    "httpx>=0.27.0",
    
    # Configuration & Settings
    "python-dotenv>=1.0.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "email-validator>=2.0.0",
    
    # Time & Locale
    "pytz>=2024.0",
    "tzlocal>=5.0",
    
    # LLM & AI
    "openai>=1.50.0",
    "langchain==1.0.0",
    "langchain-community>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-text-splitters>=0.3.0",   # 文本分割工具 (LangChain 0.3+ 必需)
    
    # Vector Store & Embeddings
    "faiss-cpu>=1.8.0",
    "tiktoken>=0.8.0",
    
    # Document Processing
    "unstructured[pdf]>=0.16.0",
    "python-docx>=1.1.0",                 # Word 文件處理
    "openpyxl>=3.1.0",                    # Excel 文件處理
    "python-pptx>=0.6.0",                 # PowerPoint 文件處理
    "tabulate>=0.9.0",                    # 表格格式化 (pandas HTML 轉換需要)
    
    # Database & Cache
    "redis>=5.0.0",
    "pymongo>=4.6.0",
    
    # Authentication & Security
    "python-jose[cryptography]>=3.3.0",  # JWT token 生成與驗證
    "passlib==1.7.4",            # 密碼雜湊
    "bcrypt==4.0.1",                      # bcrypt 演算法 (passlib 的依賴)
    
    # PDF & Image Processing
    "reportlab>=4.0.0",
    "pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.14.0",
    "httpx>=0.27.0",
    "respx>=0.21.0",
]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["article_copilot*"]
exclude = ["data*", "docker*", "rag_evaluation*", "tests*", "*.tests*"]

[tool.setuptools.package-data]
article_copilot = ["*.json", "*.yaml", "*.yml", "*.toml", "*.md"]
